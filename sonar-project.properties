# SonarCloud project configuration for clinivio-backend.
#
# sonar.organization must match your SonarCloud organization key exactly
# (sonarcloud.io -> Organization -> Administration -> Organization key).
# "whizzgit" is a placeholder based on the GitHub org (WhizzGit) -- update
# it if SonarCloud assigned you a different slug during setup.
sonar.projectKey=WhizzGit_clinivio-backend
sonar.organization=whizzgit

# Monorepo layout: NestJS apps + shared libs (see apps/, libs/)
sonar.sources=apps,libs
sonar.tests=apps/api/src
sonar.test.inclusions=**/*.spec.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.d.ts,**/migrations/**,**/__azurite_db_*.json

# Produced by `pnpm --filter @mediflow/api test:cov` (jest --coverage, lcov reporter is on by default)
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/api/coverage/lcov.info

sonar.sourceEncoding=UTF-8
